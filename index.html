<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Bowling Pro</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #38bdf8;
            --accent: #f43f5e;
            --success: #22c55e;
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.6rem;
            margin: 0;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            background: rgba(56, 189, 248, 0.1);
            padding: 10px 14px;
            border-radius: 10px;
            border-left: 4px solid var(--primary);
        }

        .turno-text {
            font-size: 1rem;
            font-weight: bold;
        }

        .frame-badge {
            background: var(--primary);
            color: var(--bg-color);
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 0.85rem;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            padding: 12px;
            font-size: 1.1rem;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 10px;
            outline: none;
            text-align: center;
            font-weight: bold;
        }

        input:focus {
            border-color: var(--primary);
        }

        button.action-btn {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: white;
            border: none;
            padding: 0 20px;
            font-size: 1rem;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(56, 189, 248, 0.3);
        }

        button.action-btn:active {
            transform: scale(0.95);
        }

        .quick-pins {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            margin-top: 12px;
        }

        .pin-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 10px 0;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .pin-btn:hover {
            background: #475569;
        }

        .pin-btn.strike-btn {
            background: rgba(244, 63, 94, 0.2);
            color: #fb7185;
            border: 1px solid var(--accent);
        }

        .boards-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .board {
            background: var(--card-bg);
            padding: 14px;
            border-radius: 14px;
            border: 2px solid transparent;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .board.active-board {
            border-color: var(--primary);
            background: linear-gradient(145deg, #1e293b, #0f233c);
        }

        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border-bottom: 1px solid #334155;
            padding-bottom: 6px;
        }

        .board-name {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--primary);
        }

        .board-total {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--success);
        }

        .frames-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .frame-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 4px;
            text-align: center;
        }

        .frame-number {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .frame-scores {
            display: flex;
            justify-content: center;
            gap: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            min-height: 18px;
        }

        .roll-mark {
            width: 14px;
            text-align: center;
        }

        .strike { color: var(--accent); }
        .spare { color: var(--warning); }

        .btn-container {
            display: flex;
            gap: 8px;
        }

        .btn-secondary {
            background-color: #334155;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            flex: 1;
            cursor: pointer;
        }

        .btn-danger {
            background-color: rgba(244, 63, 94, 0.15);
            color: var(--accent);
            border: 1px solid rgba(244, 63, 94, 0.3);
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            flex: 1;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🎳 Mini Bowling Pro</h1>
            <div class="subtitle">¡Batalla de Pinos!</div>
        </header>

        <div class="card">
            <div class="status-box">
                <span class="turno-text" id="turnoText">Turno: -</span>
                <span class="frame-badge" id="frameBadge">Marco 1/5</span>
            </div>
            <div class="input-group">
                <input type="number" id="pinosInput" placeholder="Pinos (0-10)" min="0" max="10" inputmode="numeric">
                <button class="action-btn" onclick="registrarTiroManual()">Tirar</button>
            </div>
            <div class="quick-pins" id="quickPinsContainer"></div>
        </div>

        <div id="boardsContainer" class="boards-container"></div>

        <div class="btn-container">
            <button class="btn-secondary" onclick="configurarJugadores()">Jugadores</button>
            <button class="btn-danger" onclick="reiniciarPartida()">Reiniciar</button>
        </div>
    </div>

    <script>
        const MAX_FRAMES = 5;
        let estadoJuego = {
            jugadores: ["Bauti", "Juan"],
            indiceTurno: 0,
            marcoActual: 1,
            tiroEnMarco: 1,
            datos: {}
        };

        function inicializarEstructura() {
            if (!estadoJuego.jugadores || estadoJuego.jugadores.length === 0) {
                estadoJuego.jugadores = ["Bauti", "Juan"];
            }
            if (!estadoJuego.datos) {
                estadoJuego.datos = {};
            }
            estadoJuego.jugadores.forEach(j => {
                if (!estadoJuego.datos[j]) {
                    estadoJuego.datos[j] = {
                        frames: Array(MAX_FRAMES).fill().map(() => []),
                        total: 0
                    };
                }
            });
        }

        function guardarMemoria() {
            localStorage.setItem('mini_bowling_state_v2', JSON.stringify(estadoJuego));
        }

        function cargarMemoria() {
            const guardado = localStorage.getItem('mini_bowling_state_v2');
            if (guardado) {
                try {
                    let parsed = JSON.parse(guardado);
                    if (parsed && parsed.jugadores && parsed.jugadores.length > 0) {
                        estadoJuego = parsed;
                    } else {
                        resetearJuegoCompleto();
                    }
                } catch (e) {
                    resetearJuegoCompleto();
                }
            } else {
                resetearJuegoCompleto();
            }
            inicializarEstructura();
        }

        function resetearJuegoCompleto() {
            estadoJuego = {
                jugadores: ["Bauti", "Juan"],
                indiceTurno: 0,
                marcoActual: 1,
                tiroEnMarco: 1,
                datos: {}
            };
            inicializarEstructura();
            guardarMemoria();
        }

        function configurarJugadores() {
            let actual = estadoJuego.jugadores ? estadoJuego.jugadores.join(", ") : "Bauti, Juan";
            let inputNombres = prompt("Ingresá los nombres de los jugadores separados por coma:", actual);
            if (!inputNombres || inputNombres.trim() === "") return;

            let nuevosJugadores = inputNombres.split(',').map(n => n.trim()).filter(n => n.length > 0);
            if (nuevosJugadores.length === 0) return;

            estadoJuego.jugadores = nuevosJugadores;
            estadoJuego.indiceTurno = 0;
            estadoJuego.marcoActual = 1;
            estadoJuego.tiroEnMarco = 1;
            estadoJuego.datos = {};
            inicializarEstructura();
            guardarMemoria();
            actualizarUI();
        }

        function generarBotonesRapidos() {
            const container = document.getElementById('quickPinsContainer');
            if (!container) return;
            container.innerHTML = '';
            for (let i = 0; i <= 10; i++) {
                const btn = document.createElement('button');
                btn.className = `pin-btn ${i === 10 ? 'strike-btn' : ''}`;
                btn.textContent = i === 10 ? 'strike 🎳' : i;
                btn.onclick = () => procesarTiro(i);
                container.appendChild(btn);
            }
        }

        function registrarTiroManual() {
            const input = document.getElementById('pinosInput');
            if (!input) return;
            const valor = parseInt(input.value);
            if (isNaN(valor) || valor < 0 || valor > 10) {
                alert("Por favor ingresa un número válido entre 0 y 10.");
                return;
            }
            procesarTiro(valor);
            input.value = '';
        }

        function procesarTiro(pinos) {
            if (estadoJuego.marcoActual > MAX_FRAMES) {
                alert("¡La partida ya terminó! Tocá en Reiniciar para una revancha.");
                return;
            }

            const jugadorActual = estadoJuego.jugadores[estadoJuego.indiceTurno];
            const frameIndex = estadoJuego.marcoActual - 1;
            const tirosDelFrame = estadoJuego.datos[jugadorActual].frames[frameIndex];

            if (estadoJuego.tiroEnMarco === 2) {
                let primerTiro = tirosDelFrame[0];
                if (primerTiro < 10 && (primerTiro + pinos) > 10) {
                    alert(`¡Imposible! Quedaban ${10 - primerTiro} pinos en pie.`);
                    return;
                }
            }

            tirosDelFrame.push(pinos);
            recalcularPuntajes();

            let esStrike = (estadoJuego.tiroEnMarco === 1 && pinos === 10);
            let finDelTurno = (esStrike || estadoJuego.tiroEnMarco === 2);

            if (finDelTurno) {
                estadoJuego.tiroEnMarco = 1;
                estadoJuego.indiceTurno = (estadoJuego.indiceTurno + 1) % estadoJuego.jugadores.length;
                if (estadoJuego.indiceTurno === 0) {
                    estadoJuego.marcoActual++;
                }
            } else {
                estadoJuego.tiroEnMarco = 2;
            }

            guardarMemoria();
            actualizarUI();
        }

        function recalcularPuntajes() {
            estadoJuego.jugadores.forEach(j => {
                let sumaTotal = 0;
                estadoJuego.datos[j].frames.forEach(frame => {
                    frame.forEach(tiro => sumaTotal += tiro);
                });
                estadoJuego.datos[j].total = sumaTotal;
            });
        }

        function actualizarUI() {
            const container = document.getElementById('boardsContainer');
            const turnoText = document.getElementById('turnoText');
            const frameBadge = document.getElementById('frameBadge');

            if (!container || !turnoText || !frameBadge) return;

            const jugadorActual = estadoJuego.jugadores[estadoJuego.indiceTurno];

            if (estadoJuego.marcoActual > MAX_FRAMES) {
                turnoText.innerHTML = `🏆 <b>¡Partida Finalizada!</b>`;
                frameBadge.textContent = `Fin`;
            } else {
                turnoText.innerHTML = `Turno: <b>${jugadorActual}</b> (Tiro ${estadoJuego.tiroEnMarco})`;
                frameBadge.textContent = `Marco ${estadoJuego.marcoActual}/${MAX_FRAMES}`;
            }

            container.innerHTML = '';

            estadoJuego.jugadores.forEach((jugador, index) => {
                const info = estadoJuego.datos[jugador];
                const esTurnoActual = (index === estadoJuego.indiceTurno && estadoJuego.marcoActual <= MAX_FRAMES);

                const boardDiv = document.createElement('div');
                boardDiv.className = `board ${esTurnoActual ? 'active-board' : ''}`;

                let framesHTML = '';
                for (let f = 0; f < MAX_FRAMES; f++) {
                    let tiros = info.frames[f] || [];
                    let t1 = tiros[0] !== undefined ? tiros[0] : '';
                    let t2 = tiros[1] !== undefined ? tiros[1] : '';

                    let marca1 = t1;
                    let marca2 = t2;
                    let claseT1 = "";
                    let claseT2 = "";

                    if (t1 === 10) {
                        marca1 = 'X';
                        marca2 = '';
                        claseT1 = 'strike';
                    } else if (t1 !== '' && t2 !== '' && (t1 + t2 === 10)) {
                        marca2 = '/';
                        claseT2 = 'spare';
                    }

                    framesHTML += `
                        <div class="frame-box">
                            <div class="frame-number">#${f+1}</div>
                            <div class="frame-scores">
                                <span class="roll-mark ${claseT1}">${marca1}</span>
                                <span class="roll-mark ${claseT2}">${marca2}</span>
                            </div>
                        </div>
                    `;
                }

                boardDiv.innerHTML = `
                    <div class="board-header">
                        <span class="board-name">${jugador}</span>
                        <span class="board-total">${info.total} pts</span>
                    </div>
                    <div class="frames-grid">
                        ${framesHTML}
                    </div>
                `;

                container.appendChild(boardDiv);
            });
        }

        function reiniciarPartida() {
            if (confirm("¿Querés reiniciar la partida actual?")) {
                resetearJuegoCompleto();
                actualizarUI();
            }
        }

        // Inicialización segura al cargar
        window.onload = function() {
            cargarMemoria();
            generarBotonesRapidos();
            actualizarUI();
        };
    </script>
</body>
</html>
